name: Quick QA long-form card stills\n# QA rerun after final VC-LF-002 label fix

on:
  push:
    branches: [lf-card-qa-v1]
    paths:
      - "video-service/scripts/qa_cards_quick.mjs"
      - ".github/workflows/qa-longform-cards-quick.yml"
  workflow_dispatch:

jobs:
  qa-card-stills:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: video-service
        run: npm install
      - name: Regenerate cards
        working-directory: video-service
        run: python3 scripts/extract_cards.py Cards
      - name: Typecheck
        working-directory: video-service
        run: npm run typecheck
      - name: Render quick card still QA
        working-directory: video-service
        run: node scripts/qa_cards_quick.mjs
      - name: Upload quick QA stills
        uses: actions/upload-artifact@v4
        with:
          name: vc-lf-card-qa-quick
          path: video-service/qa-card-stills
          retention-days: 7
