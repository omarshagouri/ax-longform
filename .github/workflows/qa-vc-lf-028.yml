name: QA VC-LF-028 title-card motion

on:
  push:
    branches: [lf-card-qa-followup-v1]
    paths:
      - "video-service/Cards/VC-LF-028.py"
      - "video-service/scripts/qa_vc_lf_028.mjs"
      - ".github/workflows/qa-vc-lf-028.yml"
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: video-service
        run: npm install
      - name: Regenerate cards
        working-directory: video-service
        run: python3 scripts/extract_cards.py Cards
      - name: Typecheck
        working-directory: video-service
        run: npm run typecheck
      - name: Render VC-LF-028 QA
        working-directory: video-service
        run: node scripts/qa_vc_lf_028.mjs
      - name: Upload VC-LF-028 QA
        uses: actions/upload-artifact@v4
        with:
          name: vc-lf-028-qa
          path: video-service/qa-vc-lf-028
          retention-days: 7
      - name: Build production container
        run: docker build -t longform-video-vc028-qa ./video-service
