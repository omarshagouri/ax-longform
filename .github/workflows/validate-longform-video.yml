name: Validate long-form video service

on:
  push:
    branches: [main]
    paths:
      - "video-service/**"
      - ".github/workflows/validate-longform-video.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: video-service
        run: npm install

      - name: Commit refreshed lockfile when needed
        run: |
          if git diff --quiet -- video-service/package-lock.json; then
            echo "Lockfile already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add video-service/package-lock.json
            git commit -m "Refresh long-form package lock"
            git push
          fi

      - name: Regenerate cards
        working-directory: video-service
        run: python3 scripts/extract_cards.py Cards

      - name: Typecheck
        working-directory: video-service
        run: npm run typecheck

      - name: Build container
        run: docker build -t longform-video-test ./video-service
