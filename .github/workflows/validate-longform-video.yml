name: Validate long-form video service

on:
  push:
    branches: [main, lf-animation-library-v1, privacy-hardening, animation-backgrounds, refactor/sync-two-part-chapters-clips]
    paths:
      - "video-service/**"
      - ".github/workflows/validate-longform-video.yml"
  pull_request:
    branches: [main]
    paths:
      - "video-service/**"
      - ".github/workflows/validate-longform-video.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: video-service
        run: npm install

      - name: Regenerate cards
        working-directory: video-service
        run: python3 scripts/extract_cards.py Cards

      - name: Test paired chapters, footage, storyboard QA and measured audio cues
        working-directory: video-service
        run: node --test server/paired-chapter.test.mjs server/clip-catalog.test.mjs server/visual-plan-validator.test.mjs server/visual-word-alignment.test.mjs server/assembly-gcs.test.mjs server/render-delivery.test.mjs server/subtitles.test.mjs server/segmented-tts.test.mjs

      - name: Test resolved catalog MP4 entries in Remotion timeline
        working-directory: video-service
        run: node scripts/test-catalog-clip-manifest.mjs

      - name: Verify all bounded LF animation controls clamp automatically
        working-directory: video-service
        run: node scripts/test-lf-animation-clamping.mjs

      - name: Typecheck
        working-directory: video-service
        run: npm run typecheck

      - name: Test full-beat LF card and animation motion
        working-directory: video-service
        run: node scripts/test-lf-full-duration-motion.mjs

      - name: Build container
        run: docker build -t longform-video-test ./video-service
