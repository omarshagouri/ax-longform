name: QA current long-form cards

on:
  push:
    branches: [main, visual-library-v2, lf-chapter-card-v3]
    paths:
      - "video-service/Cards/**"
      - "video-service/src/HtmlCard.tsx"
      - "video-service/scripts/qa_cards.mjs"
      - ".github/workflows/qa-longform-cards.yml"
  workflow_dispatch:

jobs:
  qa-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: video-service
        run: npm install
      - name: Regenerate cards
        working-directory: video-service
        run: python3 scripts/extract_cards.py Cards
      - name: Typecheck
        working-directory: video-service
        run: npm run typecheck
      - name: Render current card QA suite
        working-directory: video-service
        run: node scripts/qa_cards.mjs
      - name: Upload current card QA
        uses: actions/upload-artifact@v4
        with:
          name: vc-lf-card-qa-current
          path: video-service/qa-card-output
          retention-days: 7
      - name: Build production container
        run: docker build -t longform-card-qa ./video-service
