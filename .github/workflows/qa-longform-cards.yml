name: QA long-form cards

on:
  push:
    branches: [lf-card-qa-v1]
    paths:
      - "video-service/**"
      - ".github/workflows/qa-longform-cards.yml"
  workflow_dispatch:

jobs:
  qa-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: video-service
        run: npm install

      - name: Regenerate cards
        working-directory: video-service
        run: python3 scripts/extract_cards.py Cards

      - name: Typecheck
        working-directory: video-service
        run: npm run typecheck

      - name: Render card QA suite
        working-directory: video-service
        run: node scripts/qa_cards.mjs

      - name: Upload card QA renders
        uses: actions/upload-artifact@v4
        with:
          name: vc-lf-card-qa-v1
          path: video-service/qa-card-output
          retention-days: 7

      - name: Build production container
        run: docker build -t longform-video-card-qa ./video-service
