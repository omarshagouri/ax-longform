name: QA dashboard preview
on:
  pull_request:
    branches: [main]
    paths:
      - 'video-service/src/Dashboard.tsx'
      - 'video-service/scripts/test-lf-dashboard-motion.mjs'
      - 'video-service/Animations/registry.tsx'
      - 'video-service/src/AnimationPreview.tsx'
      - 'video-service/public/dashboard-bg.png'
      - 'video-service/src/Root.tsx'
      - 'video-service/src/animations.tsx'
      - 'video-service/server/index.mjs'
      - '.github/workflows/qa-dashboard-preview.yml'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: video-service
      - run: python3 scripts/extract_cards.py Cards
        working-directory: video-service
      - name: Check bundled background
        run: |
          test -s public/dashboard-bg.png
          file public/dashboard-bg.png | grep -q '1920 x 1080'
        working-directory: video-service
      - run: npm run typecheck
        working-directory: video-service
      - run: node --check server/index.mjs
        working-directory: video-service
      - run: npx remotion browser ensure
        working-directory: video-service
      - name: Render six-second dashboard smoke test
        working-directory: video-service
        run: |
          mkdir -p out
          npx remotion render AXDashboardPreview out/dashboard-smoke.mp4 \
            --codec h264 --crf 24 --concurrency 2 --log error
          test -s out/dashboard-smoke.mp4
      - name: Verify VA-LF-014 advances over 6, 8 and 12 second beats
        working-directory: video-service
        run: node scripts/test-lf-dashboard-motion.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-smoke-preview
          path: video-service/out/dashboard-smoke.mp4
          retention-days: 7
